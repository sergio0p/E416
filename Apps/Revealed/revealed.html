  gap: 0.4em;

  <script>
    let budgets = null; // Store budgets globally for feedback

    /* ----------------------------------------------------------------
       Problem generation.

       The chosen basket is picked as a fraction along its own budget line
       rather than at an absolute coordinate, so it stays clear of both axes
       whatever the price level happens to be.

       Draws whose baskets would overlap once scaled are rejected and redrawn
       (D). The test is done in view units, because whether two baskets look
       crowded depends on the frame they end up in, not on their raw distance.
       ---------------------------------------------------------------- */

    const PAD = 1.08;              // headroom past the largest intercept
    const MIN_SEPARATION = 11;     // view units, out of 100
    const MAX_SCALE_RATIO = 2.5;   // largest : smallest intercept, per axis
    const MAX_DRAWS = 400;

    let frame = { xMax: 100, yMax: 100 };

    function randomBudget() {
      const px = Math.random() * 6 + 0.75;
      const py = Math.random() * 6 + 0.75;
      const income = Math.random() * 70 + 70;
      const t = 0.15 + Math.random() * 0.70;      // position along the line
      const x = t * income / px;
      const y = (1 - t) * income / py;
      return { px, py, income, chosen: { x, y } };
    }

    /* The frame is the largest intercept on each axis, padded (A). */
    function frameFor(budgets) {
      let xMax = 0, yMax = 0;
      for (const k of labels) {
        const b = budgets[k];
        xMax = Math.max(xMax, b.income / b.px);
        yMax = Math.max(yMax, b.income / b.py);
      }
      return { xMax: xMax * PAD, yMax: yMax * PAD };
    }

    function minSeparation(budgets) {
      const f = frameFor(budgets);
      const pts = labels.map(k => ({
        vx: budgets[k].chosen.x / f.xMax * 100,
        vy: 100 - budgets[k].chosen.y / f.yMax * 100
      }));
      let worst = Infinity;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          worst = Math.min(worst, Math.hypot(pts[i].vx - pts[j].vx, pts[i].vy - pts[j].vy));
        }
      }
      return worst;
    }

    /* Fitting the frame to the largest intercept exposed a second problem the
       fixed axes had been hiding: when one budget is several times the size of
       another, the small ones collapse into the corner. Unaided, two thirds of
       draws have one budget at least three times another. Comparable budgets
       also cross more often, which is what makes the relations worth asking
       about at all — a budget that sits entirely outside another decides every
       comparison by itself. */
    function scaleRatio(budgets) {
      const xs = labels.map(k => budgets[k].income / budgets[k].px);
      const ys = labels.map(k => budgets[k].income / budgets[k].py);
      return Math.max(
        Math.max(...xs) / Math.min(...xs),
        Math.max(...ys) / Math.min(...ys)
      );
    }

    function getBudgetsAndChoices() {
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < MAX_DRAWS; i++) {
        const cand = { r: randomBudget(), b: randomBudget(), g: randomBudget() };
        const gap = minSeparation(cand);
        const ratio = scaleRatio(cand);
        if (gap >= MIN_SEPARATION && ratio <= MAX_SCALE_RATIO) return cand;

        // Otherwise remember whichever draw comes closest to satisfying both,
        // so a hard seed degrades gracefully instead of hanging.
        const score = Math.min(gap / MIN_SEPARATION, MAX_SCALE_RATIO / ratio);
        if (score > bestScore) { bestScore = score; best = cand; }
      }
      return best;
    }

    let selectedStatements = new Set();

    function generateStatements() {
    const statements = [];

    const typeOrder = ['SDR', 'DR', 'IR'];  // hardcoded preferred order
    for (const type of typeOrder) {
      const rel = relations.find(r => r.type === type);
      for (const i of labels) {
        for (const j of labels) {
          if (i !== j) {
            statements.push({ 
              left: i, 
              right: j, 
              type: rel.type, 
              symbol: rel.symbol
            });
          }
        }
      }
    }

    return statements;
  }

    function dot(p, b) {
      return p.px * b.x + p.py * b.y;
    }

    function isDR(budgets, i, j) {
      const pi = budgets[i];
      const xj = budgets[j].chosen;
      return dot(pi, xj) <= pi.income + 1e-6;
    }

    function isIR(budgets, i, j) {
      const graph = {};
      for (const a of labels) graph[a] = [];
      for (const a of labels) {
        for (const b of labels) {
          if (a !== b && isDR(budgets, a, b)) {
            graph[a].push(b);
          }
        }
      }
      const visited = new Set();
      function dfs(u) {
        if (u === j) return true;
        visited.add(u);
        for (const v of graph[u]) {
          if (!visited.has(v) && dfs(v)) return true;
        }
        return false;
      }
      return dfs(i);
    }

    function isSDR(budgets, i, j) {
      const pi = budgets[i];
      const xi = pi.chosen;
      const xj = budgets[j].chosen;
      return dot(pi, xi) > dot(pi, xj) + 1e-6;
    }

    function evaluateStatement(stmt, budgets) {
      const { left, right, type } = stmt;
      if (type === 'DR') return isDR(budgets, left, right);
      if (type === 'IR') return isIR(budgets, left, right);
      if (type === 'SDR') return isSDR(budgets, left, right);
      return false;
    }

    const SVGNS = "http://www.w3.org/2000/svg";
    const COLOR = { r: 'var(--budget-r)', b: 'var(--budget-b)', g: 'var(--budget-g)' };

    function svgEl(tag, attrs) {
      const n = document.createElementNS(SVGNS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }

    function dataToView(x, y) {
      return { vx: x / frame.xMax * 100, vy: 100 - y / frame.yMax * 100 };
    }

    /* A round number close to range/6, so the ticks read 0, 10, 20 ... rather
       than 0, 13.7, 27.4 ... whatever the frame turns out to be (B). */
    function niceStep(range) {
      const raw = range / 6;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
      return step * mag;
    }

    function drawBudgetLines(budgets) {
      const svg = document.getElementById("svg-container");
      svg.innerHTML = '';
      frame = frameFor(budgets);

      const defs = svgEl('defs', {});
      defs.innerHTML = `
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3"
                orient="auto" markerUnits="strokeWidth">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="#E6D1AD" />
        </marker>`;
      svg.appendChild(defs);

      const gGrid   = svgEl('g', {});
      const gAxes   = svgEl('g', {});
      const gLines  = svgEl('g', {});
      const gPoints = svgEl('g', {});
      [gGrid, gAxes, gLines, gPoints].forEach(g => svg.appendChild(g));

      // ---- ticks and grid (B)
      const xStep = niceStep(frame.xMax), yStep = niceStep(frame.yMax);

      for (let x = xStep; x <= frame.xMax; x += xStep) {
        const p = dataToView(x, 0);
        gGrid.appendChild(svgEl('line', { x1: p.vx, y1: 0, x2: p.vx, y2: 100, class: 'grid-line' }));
        gAxes.appendChild(svgEl('line', { x1: p.vx, y1: 100, x2: p.vx, y2: 101.6, class: 'tick-mark' }));
        const t = svgEl('text', { x: p.vx, y: 105.5, class: 'tick', 'text-anchor': 'middle' });
        t.textContent = Math.round(x);
        gAxes.appendChild(t);
      }
      for (let y = yStep; y <= frame.yMax; y += yStep) {
        const p = dataToView(0, y);
        gGrid.appendChild(svgEl('line', { x1: 0, y1: p.vy, x2: 100, y2: p.vy, class: 'grid-line' }));
        gAxes.appendChild(svgEl('line', { x1: -1.6, y1: p.vy, x2: 0, y2: p.vy, class: 'tick-mark' }));
        const t = svgEl('text', { x: -3, y: p.vy + 1.2, class: 'tick', 'text-anchor': 'end' });
        t.textContent = Math.round(y);
        gAxes.appendChild(t);
      }
      const zero = svgEl('text', { x: -3, y: 105.5, class: 'tick', 'text-anchor': 'middle' });
      zero.textContent = '0';
      gAxes.appendChild(zero);

      // ---- axes
      gAxes.appendChild(svgEl('line', { x1: 0, y1: 100, x2: 104, y2: 100, class: 'axis-line', 'marker-end': 'url(#arrowhead)' }));
      gAxes.appendChild(svgEl('line', { x1: 0, y1: 100, x2: 0, y2: -4, class: 'axis-line', 'marker-end': 'url(#arrowhead)' }));

      const xn = svgEl('text', { x: 106, y: 101.6, class: 'axis-name' }); xn.textContent = 'x';
      const yn = svgEl('text', { x: 0, y: -7, class: 'axis-name', 'text-anchor': 'middle' }); yn.textContent = 'y';
      gAxes.appendChild(xn); gAxes.appendChild(yn);

      // ---- budgets
      for (const key of labels) {
        const { px, py, income, chosen } = budgets[key];
        const colour = COLOR[key];

        const p0 = dataToView(0, income / py);       // y-intercept
        const p1 = dataToView(income / px, 0);       // x-intercept

        gLines.appendChild(svgEl('line', {
          x1: p0.vx, y1: p0.vy, x2: p1.vx, y2: p1.vy,
          class: 'budget-line', stroke: colour
        }));

        const d = dataToView(chosen.x, chosen.y);
        gPoints.appendChild(svgEl('circle', { cx: d.vx, cy: d.vy, r: 1.5, class: 'chosen-dot', fill: colour }));

        /* Each label is pushed along its own line's outward normal (C). Three
           budgets with three slopes therefore send their labels three different
           ways, which is what stops them stacking when the baskets are close. */
        let nx = p1.vy - p0.vy, ny = -(p1.vx - p0.vx);
        const len = Math.hypot(nx, ny) || 1;
        nx /= len; ny /= len;
        if ((d.vx - 0) * nx + (d.vy - 100) * ny < 0) { nx = -nx; ny = -ny; }

        const OFF = 6;
        const lx = d.vx + nx * OFF, ly = d.vy + ny * OFF;

        gPoints.appendChild(svgEl('line', {
          x1: d.vx + nx * 2, y1: d.vy + ny * 2,
          x2: lx - nx * 1.4, y2: ly - ny * 1.4,
          class: 'leader', stroke: colour
        }));

        const label = svgEl('text', {
          x: lx, y: ly, class: 'basket-label', fill: colour,
          'text-anchor': nx >= 0 ? 'start' : 'end',
          'dominant-baseline': 'central'
        });
        label.setAttribute('dx', nx >= 0 ? 0.6 : -0.6);
        label.textContent = key;
        gPoints.appendChild(label);
      }
    }

    function getExplanation(stmt, budgets) {
      const { left, right, type } = stmt;
      const pi = budgets[left];
      const pj = budgets[right];
      const xi = pi.chosen;
      const xj = pj.chosen;
      const costI = dot(pi, xi).toFixed(2);
      const costJ = dot(pi, xj).toFixed(2);

      if (type === 'DR') return `Under ${left}'s prices, bundle ${right} costs ${costJ}, which exceeds income.`;
      if (type === 'SDR') return `Under ${left}'s prices, bundle ${left} costs ${costI}, while ${right} costs ${costJ}. ${left} is not strictly more expensive.`;
      if (type === 'IR') return `No sequence of directly revealed preferences connects ${left} to ${right}.`;
      return 'Incorrect.';
    }
// New functions to show/hide feedback in the dedicated window
function showFeedback(stmt, explanation) {
  const feedbackWindow = document.getElementById('feedback-window');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackContent = document.getElementById('feedback-content');
  
  feedbackTitle.innerHTML = `Not true: ${stmt.left} ${stmt.symbol} ${stmt.right}`;
  feedbackContent.textContent = explanation;
  feedbackWindow.classList.add('show');
}

function hideFeedback() {
  document.getElementById('feedback-window').classList.remove('show');
}
    let statements = [];

    function renderApp() {
      budgets = getBudgetsAndChoices();
      drawBudgetLines(budgets);

      statements = generateStatements();
      selectedStatements.clear();
      hideFeedback();
      document.getElementById('score').textContent = '';

      const container = document.getElementById('statements');
      container.innerHTML = '';

      for (const [idx, stmt] of statements.entries()) {
        const div = document.createElement('div');
        div.className = 'statement';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `stmt-${idx}`;
        checkbox.addEventListener('change', e => {
          if (e.target.checked) selectedStatements.add(idx);
          else selectedStatements.delete(idx);
        });

        const label = document.createElement('label');
        label.htmlFor = `stmt-${idx}`;
        label.innerHTML = `${stmt.left} ${stmt.symbol} ${stmt.right}`;
        div.appendChild(checkbox);
        div.appendChild(label);
        container.appendChild(div);
      }
    }

    function checkAnswers() {
      let correct = 0;
      const total = selectedStatements.size;
      let firstIncorrect = null;

      document.querySelectorAll('.correct, .incorrect').forEach(m => m.remove());

      for (const idx of selectedStatements) {
        const stmt = statements[idx];
        const div = document.getElementById(`stmt-${idx}`).parentElement;
        const result = evaluateStatement(stmt, budgets);

        const mark = document.createElement('span');
        mark.className = result ? 'correct' : 'incorrect';
        mark.textContent = result ? '\u2713' : '\u2715';

        if (!result) {
          const explanation = getExplanation(stmt, budgets);
          mark.addEventListener('mouseenter', () => showFeedback(stmt, explanation));
          mark.addEventListener('mouseleave', hideFeedback);
          if (!firstIncorrect) firstIncorrect = { stmt, explanation };
        }

        div.appendChild(mark);
        if (result) correct++;
      }

      if (firstIncorrect) showFeedback(firstIncorrect.stmt, firstIncorrect.explanation);
      else hideFeedback();

      const score = total > 0 ? Math.round((correct / total) * 100) : 0;
      document.getElementById('score').textContent =
        total === 0 ? 'Nothing ticked yet.' : `${correct} of ${total} ticked statements hold \u2014 ${score}%.`;
    }

    // Bound once, not per problem: re-binding inside renderApp would stack a
    // fresh listener on every new problem.
    window.addEventListener('load', () => {
      renderApp();
      document.getElementById('done-btn').addEventListener('click', checkAnswers);
      document.getElementById('new-btn').addEventListener('click', renderApp);
    });

  </script>
