<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Revealed Preference App</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
      flex-direction: row;
      height: 100vh;
    }
    #left-panel {
      width: 50%;
      padding: 10px;
      box-sizing: border-box;
    }
    #svg-container {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
    }
    #right-panel {
      width: 45%;
      padding: 5px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .statement {
      display: flex;
      align-items: center;
      font-size: 1em;
    }
    .statement input {
      margin-right: 0.5em;
    }

   #statements {
  display: grid;
  grid-auto-flow: column;             /* Fill down columns first */
  grid-template-rows: repeat(6, auto); /* 18 items ÷ 3 columns = 6 rows */
  gap: 6px 16px;
  justify-content: center;
  }
    .correct {
      color: green;
      margin-left: 10px;
    }
.incorrect {
  color: red;
  margin-left: 10px;
  cursor: pointer;
}
    #done-btn {
      margin-top: 1em;
      padding: 0.5em 1em;
      font-size: 1em;
    }
    #score {
      font-weight: bold;
      margin-bottom: 1em;
    }
    /* Add these new styles */
#feedback-window {
  background-color: #f9f9f9;
  border: 2px solid #ddd;
  border-radius: 8px;
  padding: 15px;
  margin: 15px 0;
  min-height: 80px;
  display: none;
}

#feedback-window.show {
  display: block;
}

#feedback-title {
  font-weight: bold;
  color: #333;
  margin-bottom: 10px;
  border-bottom: 1px solid #eee;
  padding-bottom: 5px;
}

#feedback-content {
  color: #666;
  line-height: 1.4;
}

.feedback-error {
  background-color: #fee;
  border-color: #fcc;
}

.feedback-error #feedback-title {
  color: #a00;
}

.feedback-error #feedback-content {
  color: #800;
}
  </style>
</head>

    function getBudgetsAndChoices() {
      function randomBudget() {
        const px = Math.random() * 6 + 0.75;
        const py = Math.random() * 6 + 0.75;
        const income = Math.random() * 70 + 70;

        const xMinBudget = (income - 95 * py) / px;
        const xMaxBudget = (income - 5 * py) / px;

        const xMin = Math.max(5, xMinBudget);
        const xMax = Math.min(95, xMaxBudget);

        if (xMax < xMin) {
          // fallback: center of budget line
          const x = income / (2 * px);
          const y = (income - px * x) / py;
          return { px, py, income, chosen: { x, y } };
        }

        const x = Math.random() * (xMax - xMin) + xMin;
        const y = (income - px * x) / py;

  return { px, py, income, chosen: { x, y } };
  }
      return { r: randomBudget(), b: randomBudget(), g: randomBudget() };
    }

    let selectedStatements = new Set();

    function generateStatements() {
    const statements = [];

    const typeOrder = ['SDR', 'DR', 'IR'];  // hardcoded preferred order
    for (const type of typeOrder) {
      const rel = relations.find(r => r.type === type);
      for (const i of labels) {
        for (const j of labels) {
          if (i !== j) {
            statements.push({ 
              left: i, 
              right: j, 
              type: rel.type, 
              symbol: rel.symbol
            });
          }
        }
      }
    }

    return statements;
  }

    function dot(p, b) {
      return p.px * b.x + p.py * b.y;
    }

    function isDR(budgets, i, j) {
      const pi = budgets[i];
      const xj = budgets[j].chosen;
      return dot(pi, xj) <= pi.income + 1e-6;
    }

    function isIR(budgets, i, j) {
      const graph = {};
      for (const a of labels) graph[a] = [];
      for (const a of labels) {
        for (const b of labels) {
          if (a !== b && isDR(budgets, a, b)) {
            graph[a].push(b);
          }
        }
      }
      const visited = new Set();
      function dfs(u) {
        if (u === j) return true;
        visited.add(u);
        for (const v of graph[u]) {
          if (!visited.has(v) && dfs(v)) return true;
        }
        return false;
      }
      return dfs(i);
    }

    function isSDR(budgets, i, j) {
      const pi = budgets[i];
      const xi = pi.chosen;
      const xj = budgets[j].chosen;
      return dot(pi, xi) > dot(pi, xj) + 1e-6;
    }

    function evaluateStatement(stmt, budgets) {
      const { left, right, type } = stmt;
      if (type === 'DR') return isDR(budgets, left, right);
      if (type === 'IR') return isIR(budgets, left, right);
      if (type === 'SDR') return isSDR(budgets, left, right);
      return false;
    }

    function drawBudgetLines(budgets) {
      const svg = document.getElementById("svg-container");
      svg.innerHTML = '';
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      defs.innerHTML = `
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M 0 0 L 6 3 L 0 6 Z" fill="black" />
        </marker>
      `;
      svg.appendChild(defs);

      // Create a group with transform
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("transform", "translate(10, 0)");
      svg.appendChild(group);

      // Axes
      const xAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
      xAxis.setAttribute("x1", 0);
      xAxis.setAttribute("y1", 100);
      xAxis.setAttribute("x2", 90); // now ends at 90 instead of 100
      xAxis.setAttribute("y2", 100);
      xAxis.setAttribute("stroke", "black");
      xAxis.setAttribute("marker-end", "url(#arrowhead)");
      group.appendChild(xAxis);

      const yAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
      yAxis.setAttribute("x1", 0);
      yAxis.setAttribute("y1", 100);
      yAxis.setAttribute("x2", 0);
      yAxis.setAttribute("y2", 0);
      yAxis.setAttribute("stroke", "black");
      yAxis.setAttribute("marker-end", "url(#arrowhead)");
      group.appendChild(yAxis);

      for (const key of labels) {
        const { px, py, income, chosen } = budgets[key];
        const color = key === 'r' ? 'red' : key === 'b' ? 'blue' : 'green';

        const x0 = 0;
        const y0 = income / py;
        const x1 = income / px;
        const y1 = 0;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x0);
        line.setAttribute("y1", 100 - y0);
        line.setAttribute("x2", x1);
        line.setAttribute("y2", 100 - y1);
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", "1.5");
        group.appendChild(line);

        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", chosen.x);
        dot.setAttribute("cy", 100 - chosen.y);
        dot.setAttribute("r", 1.5);
        dot.setAttribute("fill", color);
        group.appendChild(dot);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", chosen.x + 1);
        label.setAttribute("y", 100 - chosen.y - 1);
        label.setAttribute("font-size", "4");
        label.textContent = key;
        group.appendChild(label);
      }
    }

    function getExplanation(stmt, budgets) {
      const { left, right, type } = stmt;
      const pi = budgets[left];
      const pj = budgets[right];
      const xi = pi.chosen;
      const xj = pj.chosen;
      const costI = dot(pi, xi).toFixed(2);
      const costJ = dot(pi, xj).toFixed(2);

      if (type === 'DR') return `Under ${left}'s prices, bundle ${right} costs ${costJ}, which exceeds income.`;
      if (type === 'SDR') return `Under ${left}'s prices, bundle ${left} costs ${costI}, while ${right} costs ${costJ}. ${left} is not strictly more expensive.`;
      if (type === 'IR') return `No sequence of directly revealed preferences connects ${left} to ${right}.`;
      return 'Incorrect.';
    }
// New functions to show/hide feedback in the dedicated window
function showFeedback(stmt, explanation) {
  const feedbackWindow = document.getElementById('feedback-window');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackContent = document.getElementById('feedback-content');
  
  feedbackTitle.innerHTML = `Incorrect: ${stmt.left} ${stmt.symbol} ${stmt.right}`;
  feedbackContent.textContent = explanation;
  
  feedbackWindow.className = 'feedback-error show';
}

function hideFeedback() {
  const feedbackWindow = document.getElementById('feedback-window');
  feedbackWindow.className = '';
}
    function renderApp() {
      budgets = getBudgetsAndChoices();
      drawBudgetLines(budgets);

      const statements = generateStatements();
      const container = document.getElementById('statements');
      container.innerHTML = '';

      for (const [idx, stmt] of statements.entries()) {
        const div = document.createElement('div');
        div.className = 'statement';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `stmt-${idx}`;
        checkbox.addEventListener('change', e => {
          if (e.target.checked) selectedStatements.add(idx);
          else selectedStatements.delete(idx);
        });

        const label = document.createElement('label');
        label.htmlFor = `stmt-${idx}`;
        label.innerHTML = `${stmt.left} ${stmt.symbol} ${stmt.right}`;
        div.appendChild(checkbox);
        div.appendChild(label);
        container.appendChild(div);
      }

    document.getElementById('done-btn').addEventListener('click', () => {
  let correct = 0;
  let total = selectedStatements.size;
  let firstIncorrect = null;

  // Clear previous marks
  const marks = document.querySelectorAll('.correct, .incorrect');
  marks.forEach(mark => mark.remove());

  for (const idx of selectedStatements) {
    const stmt = statements[idx];
    const div = document.getElementById(`stmt-${idx}`).parentElement;
    const result = evaluateStatement(stmt, budgets);

    const mark = document.createElement('span');
    mark.className = result ? 'correct' : 'incorrect';
    mark.textContent = result ? '✓' : '❌';

    // Add hover functionality for incorrect answers
    if (!result) {
      mark.addEventListener('mouseenter', () => {
        showFeedback(stmt, getExplanation(stmt, budgets));
      });
      mark.addEventListener('mouseleave', () => {
        hideFeedback();
      });
      
      if (!firstIncorrect) {
        firstIncorrect = { stmt, explanation: getExplanation(stmt, budgets) };
      }
    }

    div.appendChild(mark);
    if (result) correct++;
  }

  // Show first incorrect immediately
  if (firstIncorrect) {
    showFeedback(firstIncorrect.stmt, firstIncorrect.explanation);
  }

  const score = total > 0 ? Math.round((correct / total) * 100) : 0;
  document.getElementById('score').textContent = `Score: ${score}% correct`;
});
}
    window.addEventListener('load', renderApp);
  </script>
